name: release

# A tag becomes a downloadable, verifiable Windows build: a zip, a SHA256SUMS beside it, and
# a GitHub build-provenance attestation over both the zip and the two binaries inside it.
#
# Windows only, deliberately. The Linux and macOS hotkey, injection and layout backends are
# designed but not implemented — a published Linux artefact would install a binary that
# starts and then refuses to dictate, which is worse for the person who downloaded it than
# no download at all. When a backend lands, add its target to this workflow with it.
on:
  push:
    tags: ["v*"]
  # So an already-pushed tag can be released without moving it — after a run that failed on
  # something the tag is not to blame for. Not a re-release: the publish step below is
  # `gh release create`, which refuses a tag that already has a release, so replacing a
  # published one means `gh release delete <tag> --yes` (no `--cleanup-tag`) first. Deleting
  # is left a deliberate human act rather than something a dispatch does on its own.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

# One run per tag at a time. A tag push and a dispatch naming that same tag are two separate
# runs of this workflow, and both end at `gh release create` for one release: whichever gets
# there second fails, after building and attesting an artefact nobody will ever download.
# `cancel-in-progress: false` because the loser of that race is not the thing to kill — a
# run that is already uploading assets should be allowed to finish.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Exactly what publishing needs: the release and its assets, and the two the attestation
# action mints and records its signature with. Nothing wider.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # The two triggers name the tag in different places; every later step reads it from
      # here so there is one answer. `prerelease` follows semver: a hyphen in the tag
      # (v0.1.0-rc1) is a pre-release suffix, and GitHub is told so rather than offering it
      # as the latest download.
      #
      # The tag reaches the script through the environment, never spliced into its text:
      # `${{ }}` is substituted before bash parses a line, so a dispatch input of
      # `x"; curl …|sh; "` would run with this job's write permissions. Every later step
      # takes it the same way. It is then checked to *look* like a release tag before
      # anything is allowed to read it — a newline in the input would otherwise write extra
      # keys into `$GITHUB_OUTPUT`, and every later step reads those as truth.
      - id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $(printf %s "$TAG" | tr -d '\r\n' | head -c 80)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Every third-party action is pinned to a commit, not to a tag or a branch. This job
      # holds `contents: write` and `attestations: write`: an action ref that someone else
      # can move would run code able to upload release assets and mint a provenance
      # attestation under this repository's identity — forging exactly the signal README.md
      # and SECURITY.md tell people to trust. The trailing comment names the version each
      # SHA was, so a bump is still a readable diff.
      #
      # Explicitly at the tag: under workflow_dispatch the ref is a branch, and a release
      # must be built from the commit the tag names, not from whatever that branch holds.
      # Fully qualified, because a bare name makes checkout fetch both `refs/heads/<name>`
      # and `refs/tags/<name>` and prefer the branch — a branch that happened to share the
      # tag's name would be built and `--verify-tag` would still pass, since the tag does
      # exist. `refs/tags/` leaves nothing to prefer.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Before the build and the tests, because it is the cheapest thing that can fail. A
      # release whose tag says 0.2.0 while the binary prints 0.1.0 sends every bug report to
      # the wrong commit. The base of the tag must equal the package version; a suffix is
      # allowed only as a pre-release of that same version (v0.1.0-rc1 releases 0.1.0).
      #
      # The version comes from `cargo metadata`, which answers for *this package*, rather
      # than from the first `^version = ` line in Cargo.toml — that is a positional guess,
      # and a `[workspace.package]` block or any earlier top-level `version =` would be read
      # instead, silently comparing the tag against the wrong number and passing.
      - name: Tag must name the version the binary prints
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          base="${TAG#v}"; base="${base%%-*}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$base" != "$version" ]; then
            echo "::error::tag $TAG claims version $base, Cargo.toml says $version" >&2
            exit 1
          fi
          echo "$TAG builds $version"

      # This job proves the tree it is about to publish rather than assuming `ci` did. `ci`
      # does fire on a tag push, but as an independent workflow — the two start within a
      # second of each other and a red `ci` cannot stop this one from creating the release.
      # Anything published therefore passed its own tests, on the commit it was built from.
      - run: cargo test --locked

      # `--locked` so the download is built from the dependency versions Cargo.lock names —
      # the same ones CI tested. Both binaries: `byovox` cannot start a daemon that is not
      # beside it.
      - run: cargo build --release --locked

      # The runner is x86_64, so the host triple is the target the archive name claims.
      # Flat: cargo-binstall (see [package.metadata.binstall]) and a person double-clicking
      # the zip both expect the binaries at the top level.
      - name: Assemble the archive and its checksum
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Destination $stage -Path @(
            "target/release/byovox.exe",
            "target/release/byovox-daemon.exe",
            "LICENSE",
            "README.md",
            "SECURITY.md"
          )
          # Under docs/, not flattened beside the README — because the README travelling with
          # it links `docs/config.example.toml`, and the reference for the file you are about
          # to write is a poor place for a dead link. Only the binaries need the top level.
          New-Item -ItemType Directory -Force -Path "$stage/docs" | Out-Null
          Copy-Item -Destination "$stage/docs" -Path "docs/config.example.toml"
          $zip = "byovox-$env:TAG-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zip"
          # `sha256sum -c SHA256SUMS` is the check the README tells people to run, so the
          # file is written the way coreutils reads one: lowercase digest, two spaces, the
          # bare filename, and LF endings — PowerShell's default CRLF would leave a stray
          # carriage return in the filename it looks for.
          $sum = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $PWD "dist/SHA256SUMS"), "$sum  $zip`n")
          Get-Content "dist/SHA256SUMS"

      # The zip, and the two binaries separately: an unzipped byovox.exe on someone's disk
      # is then verifiable on its own, without keeping the archive it came in.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/byovox-${{ steps.tag.outputs.tag }}-x86_64-pc-windows-msvc.zip
            target/release/byovox.exe
            target/release/byovox-daemon.exe

      # `--verify-tag` refuses to invent a tag: a typo in the dispatch input fails here
      # rather than publishing a release pointing at a tag nobody pushed.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          args=(--generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" \
            "dist/byovox-$TAG-x86_64-pc-windows-msvc.zip" \
            dist/SHA256SUMS

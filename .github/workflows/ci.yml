name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      # `--locked` so CI builds the dependency versions Cargo.lock names: a run that
      # silently updated the lock would test something the maintainer never built.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The polish bench is the gate on every prompt change — "measured, not eyeballed" —
      # and until now nothing ran it. Scoring items needs the live model, but `--self-test`
      # does not: it checks offline that the bench can still read `BUILT_IN_PROMPT` and the
      # two rule-1 constants out of src/polish.rs, that the glossary rule's number matches
      # the prompt's numbering, that the two halves of the item set stay disjoint, and that
      # `typed()` still reproduces the pipeline's tail. Those are exactly the couplings a
      # Rust-only suite cannot see: #28 renumbered the glossary rule across four sites, and
      # three were caught by `cargo test` while the bench's own extraction regex was not.
      #
      # In the matrix rather than a job of its own, for two reasons. A new job would not be
      # one of the ruleset's required checks, so it could fail without blocking a merge. And
      # the bench has real per-OS behaviour to exercise — it reconfigures stdout because a
      # Windows console's default code page cannot print the Hebrew and Cyrillic items.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The minimum the bench declares (it needs `tomllib`), checked at that minimum for
          # the same reason the msrv job pins 1.88: a floor nothing runs against is a guess.
          python-version: '3.11'
      - run: python bench/polish_bench.py --self-test

  # The MSRV in Cargo.toml is a promise to anyone installing byovox, and the matrix above
  # runs on `stable`, so nothing ever built against it: a change using a feature newer than
  # 1.88 would pass CI and break exactly the users the declaration was made for. Windows is
  # the platform byovox is exercised on, so that is where the promise is checked.
  #
  # `cargo check` rather than the full suite: this asks whether the code compiles under the
  # declared minimum, which is what the version claims. Keep the toolchain in step with
  # `rust-version` in Cargo.toml — raising one without the other is what this job exists to
  # make visible.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88
      - run: cargo check --all-targets --locked

  # Dependency advisories and licence policy. One job rather than one per matrix OS: both
  # tools read `Cargo.lock` and the whole crate graph, which does not vary by runner — the
  # gtk3 advisories below are Linux-only code either way, and both tools see them anywhere.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # `--locked` on the tool installs too: a broken or tampered release of the audit
      # tooling must not change what this job runs without a lockfile change to point at.
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      # Plain `cargo audit` is already the policy byovox wants: it exits non-zero on a
      # vulnerability and zero on informational (unmaintained/unsound) advisories.
      - run: cargo audit
      # Vulnerabilities are always an error. `--warn unmaintained` demotes the advisories
      # this tree cannot act on — see the reasoning in deny.toml.
      - run: cargo deny check --warn unmaintained

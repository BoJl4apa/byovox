[package]
name = "byovox"
version = "0.1.1"
edition = "2024"
# Edition 2024 needs 1.85; let-chains (`if let … && let …`, used in config, ui, hotkey and
# inject) are stable in edition 2024 from 1.88.
rust-version = "1.88"
description = "Push-to-talk dictation against a speech-to-text server you run"
# The licence the LICENSE file already grants, said in the one place tooling reads:
# `cargo deny` warns without it and `cargo publish` refuses outright.
license = "MIT"
repository = "https://github.com/BoJl4apa/byovox"
readme = "README.md"
keywords = ["dictation", "speech-to-text", "whisper", "push-to-talk", "hotkey"]
categories = ["command-line-utilities", "accessibility", "multimedia::audio"]

# `cargo binstall byovox` — fetch the release archive instead of compiling for two minutes.
# Inert until the crate is published: binstall resolves the name through the crates.io index,
# so this block starts working with the commit that first runs `cargo publish`, and the
# README offers only the Releases page until then.
# These names must stay in step with `.github/workflows/release.yml`, which builds that
# archive: the same filename, and the same flat layout with both binaries at the top level
# (hence `bin-dir` without a directory — the default expects one named after the crate).
# `{ version }` is the package version, so binstall only ever asks for a real release tag;
# a pre-release such as v0.1.0-rc1 is deliberately not reachable this way.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/byovox-v{ version }-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

# Declared rather than auto-discovered from `src/main.rs` and `src/bin/`. Two other things
# name these binaries — the archive `.github/workflows/release.yml` builds, and `bin-dir`
# above, which tells binstall to expect exactly them at the top of it — and neither can be
# checked against a target that only exists because cargo went looking. `byovox` cannot
# start a daemon that is not beside it, so shipping one of the two is shipping neither.
[[bin]]
name = "byovox"
path = "src/main.rs"

[[bin]]
name = "byovox-daemon"
path = "src/bin/byovox-daemon.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.17.3"
directories = "6.0.0"
fontdue = "0.9.4"
hound = "3.5.1"
interprocess = "2.4.3"
muda = "0.19.3"
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
softbuffer = "0.4.8"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tray-icon = "0.24.2"
ureq = "3.4.0"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Console",
  "Win32_System_Threading",
] }
winreg = "0.55"

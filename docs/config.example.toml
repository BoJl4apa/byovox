# byovox configuration.
#
# Every key is optional and shown here at its default; delete anything you do not
# change. Unknown keys are an error, so a typo fails loudly instead of silently doing
# nothing. Secrets never go in this file: name an environment variable instead.
#
# Location: %APPDATA%\byovox\config\config.toml (Windows), ~/.config/byovox/config.toml
# (Linux), ~/Library/Application Support/byovox/config.toml (macOS).
# `byovox config` prints the effective value of every key and where it came from.

[stt]
# OpenAI-compatible base URL; byovox posts to {base_url}/audio/transcriptions.
# Plain http:// to anywhere but this machine puts your voice, your transcript and your
# bearer token on the wire in clear, and lets anyone on the path replace the reply with
# text byovox will type into your window. `byovox check` prints a `warn network` row for
# such an endpoint and the daemon logs one at startup; neither is fatal, because http://
# across a WireGuard or Tailscale link is a reasonable choice. Over anything else, use
# https:// — note that byovox verifies against the bundled Mozilla roots, not the Windows
# certificate store, so a privately-signed certificate will not be accepted.
base_url = "http://your-whisper-host:8770/v1"
# Sent as the `model` field. Self-hosted whisper.cpp ignores it; hosted APIs need a real name.
model = "whisper-1"
# Name of an environment variable holding a bearer token. Empty = no Authorization header
# (right for a server that authenticates by network identity).
api_key_env = ""
# Optional KEY=VALUE file consulted for that variable name when it is unset in the
# environment (a place to keep one token shared with other tools).
api_key_file = ""
# Vocabulary priming sent as the whisper `prompt` on every request. Names and jargon
# whisper would otherwise mangle, e.g. "Glossary: Acme, Kubernetes, Postgres, LiteLLM".
prompt = ""
# Whole-request timeout in seconds (connect is always 5 s).
timeout_s = 30
# Drop a transcript whisper itself scored as silence. Over near-silent audio whisper
# invents a stock phrase — "Thank you for watching!", "תודה." — but reports its own doubt
# as `no_speech_prob` on every segment, and byovox discards anything above this. The
# probability decides, never the text, so a real one-word utterance is never dropped for
# what it happens to say. Measured here: real speech scores at most 0.08, silent holds 0.54
# to 0.77 — the longer the silence the lower the score, so 0.3 sits in open space with room
# either way. A server that sends no segments scores nothing and is never gated. Reading the
# score needs `response_format=verbose_json`, which a few servers refuse (`gpt-4o-transcribe`
# takes `json` and `text` only): 0.0 turns the gate off and asks for plain `json`, which is
# the setting such a server needs.
no_speech_threshold = 0.3

[language]
# Language for layouts not listed in by_layout, or when the layout cannot be read.
# "auto" = let the server detect (no `language` field is sent). A whisper.cpp server must
# then run with `-l auto`, or its own default applies. Or an ISO 639-1 code to force one.
default = "auto"
# With default = "auto": restrict detection to these ISO 639-1 codes. Sent as the
# whisper.cpp-server extension field `language_candidates`; servers without it ignore
# the field. Empty = not sent.
candidates = []
# Keyboard layout language (ISO 639-1) -> explicit STT language. The layout of the
# window you are dictating into is read when you press the key.
# Example: switch to a Hebrew layout and whisper is told `language=he`.
[language.by_layout]
# he = "he"

[polish]
# Send the transcript through a chat model that adds punctuation and removes fillers.
# If this stage fails for any reason the raw transcript is typed instead.
enabled = true
# OpenAI-compatible base URL; byovox posts to {base_url}/chat/completions.
base_url = "http://your-llm-gateway:4000/v1"
model = "your-cleanup-alias"
# Environment variable holding the bearer token for the gateway.
api_key_env = ""
# Optional KEY=VALUE file consulted for that variable name when it is unset in the
# environment (a place to keep one token shared with other tools).
api_key_file = ""
# Skip polish for utterances shorter than this many words (0 = always polish).
min_words = 0
# Path to a file replacing the built-in system prompt. Empty = built-in.
prompt_file = ""
timeout_s = 20

[hotkey]
# One W3C UI Events `code` name — bare modifiers work on Windows and on Linux via evdev —
# or a chord: Modifier+...+Key, e.g. "ControlLeft+ShiftLeft+Z". Every element but the last
# must be held down; the last one triggers on top of them. A held element still does whatever
# it normally does — any accepted name may be a modifier, so a chord on CapsLock toggles caps
# every time you use it.
# Accepted, in full: ControlLeft, ControlRight, AltLeft, AltRight, ShiftLeft, ShiftRight,
# MetaLeft, MetaRight, CapsLock, ScrollLock, Pause, Insert, Escape, F13, F14, F15, F16, F17,
# F18, F19, F20, F21, F22, F23, F24 — plus the letters A-Z and the digits 0-9, accepted only
# as a chord's last element (a bare letter as the hotkey would swallow every one you type).
# Anything else is refused at startup and by `byovox check`.
# A chord's trigger is swallowed: the focused window never sees the combination, so
# ControlLeft+ShiftLeft+Z does not also reach the editor underneath. The modifiers themselves
# pass through untouched.
# A letter names a virtual key, which the active layout assigns. A non-Latin layout keeps the
# US assignments, so Z is the key a US layout labels Z on a Cyrillic or Hebrew layout too,
# where it types я or ז; another Latin layout follows its own printed letters instead — on
# QWERTZ, Z is the key QWERTY labels Y.
key = "ControlRight"
# "hold": press = record, release = send. "toggle": press to start, press again to send.
# A chord in "hold" means holding all of it — the modifiers and the trigger — while you
# speak; letting go of any one of them ends the recording.
mode = "hold"
# A hold shorter than this is an accidental tap: discarded, no request made.
min_hold_ms = 250
# Pressing this while recording discards the recording.
cancel_key = "Escape"

[inject]
# How text reaches the focused window.
#   auto           first working method for this platform (type on Windows)
#   type           synthesise keystrokes (Windows: SendInput unicode)
#   paste          put the text on the clipboard, send Ctrl+V, restore the clipboard
#   clipboard-only put the text on the clipboard and play the done cue; you paste
# Naming a method the platform cannot provide is a startup error.
mode = "auto"
# Append a space after the inserted text.
trailing_space = false
# Longest transcript, in characters, that byovox will type. A reply over this is NOT
# truncated — it is held for `byovox last` with the error cue, the same as a dictation no
# injection method could place, so nothing you said is ever lost. The point is a runaway or
# hostile endpoint: whatever the server returns is typed as real keystrokes, and a reply of
# a megabyte would hammer them into the focused window for minutes. Normal dictation is
# nowhere near this. 0 removes the limit.
max_chars = 20000

[indicator]
# Small always-on-top "recording / working" pill near the cursor (Windows, X11, macOS).
pill = true
# Short tones on start, done and error.
cue = true

[capture_log]
# Keep every dictation as a WAV plus a JSONL row (raw text, polished text, keyboard layout,
# language sent, polish model, per-stage latency) — training data for your own correction
# rules. Off by default.
enabled = false
# Directory; empty = byovox's data directory + `capture`: %APPDATA%\byovox\data\capture
# (Windows), ~/.local/share/byovox/capture (Linux),
# ~/Library/Application Support/byovox/capture (macOS).
dir = ""
# Delete captures older than this many days. What accumulates here is recordings of your
# voice and verbatim transcripts — including anything you dictated by mistake — so it does
# not grow for ever by default. Pruning runs at startup and after each dictation, and only
# ever touches files byovox itself named (`<timestamp>-<n>.wav`) plus the rows in
# dictations.jsonl; anything else you keep in this directory is left alone.
# 0 keeps everything: the right setting if you are deliberately building a corpus to tune
# no_speech_threshold or your own correction rules — which is what byovox's own author runs.
keep_days = 30

[logging]
# trace | debug | info | warn | error. Transcript text appears only at debug.
level = "info"
